[project]
name = "para-art-fix"
version = "0.1.0"
description = "Image-processing steps behind `para art fix` (asset pipeline report §6, §9 row A2): background key, pixel-grid recovery, palette lock, orphan cleanup, cell/pivot, content slicing. No generation, no network calls at run time, no GPU."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
  "Pillow>=10.0",
  # MIT, pinned to an exact commit (report §3.4, §6.3: the one grid-recovery
  # step that works as-is). Not on PyPI, so it's a git dependency.
  "pixelfixer @ git+https://github.com/Retro-Diffusion/pixel-art-fixer@ef376e57e1c272633ca2dbf5f29ec3fcf6596465#subdirectory=python",
  # Fallback grid recovery when pixelfixer's detection is implausible
  # (report §6.1 step 3). Its accelerated Wu quantizer segfaults on some
  # inputs (see grid.py); grid.py disables it before calling in.
  "unfake==1.0.7",
]

[project.scripts]
para-art-fix = "para_art_fix.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/para_art_fix"]

[tool.hatch.metadata]
allow-direct-references = true
